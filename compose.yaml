name: metabase-technos-prod
services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: metabase-technos-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME:-metabase}
      POSTGRES_USER: ${MB_DB_USER:-metabase}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - metabase_prod_pgdata:/var/lib/postgresql/data
    networks: [metabase_prod]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  metabase-prod:
    image: ${MB_IMAGE:?defina MB_IMAGE no .env}
    container_name: metabase-technos-prod
    restart: unless-stopped
    depends_on:
      postgres-prod: { condition: service_healthy }
    ports:
      - "${MB_HOST_PORT:-3002}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-prod
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_DB_DBNAME:-metabase}
      MB_DB_USER: ${MB_DB_USER:-metabase}
      MB_DB_PASS_FILE: /run/secrets/db_password
      MB_SITE_URL: ${MB_SITE_URL:-}
      JAVA_TIMEZONE: ${JAVA_TIMEZONE:-GMT}
    secrets: [db_password]
    networks: [metabase_prod]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
secrets:
  db_password:
    file: ./secrets/db_password.txt
volumes:
  metabase_prod_pgdata: {}
networks:
  metabase_prod: {}
